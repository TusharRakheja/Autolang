name: Linux GCC build & tests

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          sudo apt-get install dos2unix
          dos2unix Tests/expected/*.txt

      - name: Build auto
        run: |
          make
          make clean

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run examples and verify output
        run: |
          ./auto Examples/AssociativeArrays.al > out.txt
          diff out.txt Tests/expected/AssociativeArrays.txt

          ./auto Examples/Example7.al > out.txt
          diff out.txt Tests/expected/Example7.txt

          ./auto Examples/Fibonacci.al > out.txt
          diff out.txt Tests/expected/Fibonacci.txt

          ./auto Examples/MapTest.al > out.txt
          python Tests/scripts/checks/check_map_test_output.py out.txt

          ./auto Examples/Sort.al > out.txt
          diff out.txt Tests/expected/Sort.txt

      - name: Set up REPL examples tests
        shell: bash
        run: |
          set -euo pipefail

          REPL_GROUPS="$(python Tests/scripts/setup/setup_repl_tests.py)"
          echo "repl_groups=$REPL_GROUPS"

          if ! [[ "$REPL_GROUPS" =~ ^[0-9]+$ ]]; then
            echo "ERROR: REPL_GROUPS is not numeric: $REPL_GROUPS" >&2
            exit 1
          fi

          echo "REPL_GROUPS=$REPL_GROUPS" >> "$GITHUB_ENV"

      - name: Run REPL tests
        shell: bash
        run: |
          set -euo pipefail

          echo "repl_groups=$REPL_GROUPS"
          : > repl_out.txt

          for i in $(seq 1 "$REPL_GROUPS"); do
            f="repl_${i}.al"
            [[ -f "$f" ]] || { echo "ERROR: Missing file $f" >&2; exit 1; }
            echo "Running $f"
            ./auto < "$f" >> repl_out.txt
          done

      - name: Verify results of REPL tests
        shell: bash
        run: |
          set -euo pipefail
          python Tests/scripts/checks/check_repl_tests_results.py