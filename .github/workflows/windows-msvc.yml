name: Windows MSVC build & tests

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build auto.exe
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          nmake /f Makefile.win
          nmake /f Makefile.win clean

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run examples and verify output
        shell: cmd
        run: |
          auto.exe Examples\AssociativeArrays.al > out.txt
          fc out.txt Tests\expected\AssociativeArrays.txt || exit /b 1

          auto.exe Examples\Example7.al > out.txt
          fc out.txt Tests\expected\Example7.txt || exit /b 1

          auto.exe Examples\Fibonacci.al > out.txt
          fc out.txt Tests\expected\Fibonacci.txt || exit /b 1

          auto.exe Examples\MapTest.al > out.txt
          python Tests/scripts/check_map_test_output.py out.txt
          if %ERRORLEVEL% neq 0 exit /b 1

          auto.exe Examples\Sort.al > out.txt
          fc out.txt Tests\expected\Sort.txt || exit /b 1
